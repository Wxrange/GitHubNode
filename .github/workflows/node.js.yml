# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI
# Dictionary of event triggers 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runners run 4 jobs for each versionmm, but needs to be injected 
        node-version: [18.x, 20.x, 22.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # #@v4 means the version of installer script or GitHub Action 
    # action (url shortform) (https://github.com/actions/setup-node/tree/v4)
    - uses: actions/checkout@v4
    # dynamic step name that will automate making a unique identifying name using 
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
